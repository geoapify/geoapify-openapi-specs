<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Browse Geoapify OpenAPI 3.1 specifications.">
  <title>Geoapify OpenAPI Explorer</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.32.14/swagger-ui.css">
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --brand: #1f6bff;
      --brand-dark: #1552c8;
      --ink: #172033;
      --muted: #61708a;
      --line: #dce3ee;
      --surface: #ffffff;
      --page: #f5f7fb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--page);
    }

    .site-header {
      position: sticky;
      z-index: 20;
      top: 0;
      padding: 18px 24px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 4px 18px rgba(23, 32, 51, 0.06);
      backdrop-filter: blur(10px);
    }

    .header-content {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) minmax(280px, 520px) auto;
      gap: 24px;
      align-items: end;
      max-width: 1460px;
      margin: 0 auto;
    }

    .brand h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.2;
      letter-spacing: -0.02em;
    }

    .brand p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .spec-picker label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .spec-picker select {
      width: 100%;
      min-height: 42px;
      padding: 8px 38px 8px 12px;
      border: 1px solid #aeb9ca;
      border-radius: 7px;
      color: var(--ink);
      background: var(--surface);
      font: inherit;
      font-size: 14px;
    }

    .spec-picker select:focus {
      border-color: var(--brand);
      outline: 3px solid rgba(31, 107, 255, 0.18);
    }

    .header-links {
      display: flex;
      gap: 8px;
      align-items: center;
      padding-bottom: 2px;
    }

    .header-links a {
      display: inline-flex;
      min-height: 40px;
      align-items: center;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--brand-dark);
      background: var(--surface);
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
    }

    .header-links a:hover {
      border-color: var(--brand);
      color: var(--brand);
    }

    .status {
      max-width: 1460px;
      margin: 18px auto 0;
      padding: 12px 16px;
      border: 1px solid #f0c36a;
      border-radius: 7px;
      color: #6e4b00;
      background: #fff8e6;
      font-size: 14px;
    }

    .status.error {
      border-color: #ef9a9a;
      color: #8b1e1e;
      background: #fff0f0;
    }

    .status[hidden] {
      display: none;
    }

    #swagger-ui {
      max-width: 1460px;
      margin: 0 auto;
      padding: 8px 16px 40px;
    }

    .swagger-ui .information-container {
      margin: 0;
    }

    .swagger-ui .scheme-container {
      border-radius: 8px;
      box-shadow: 0 1px 6px rgba(23, 32, 51, 0.12);
    }

    @media (max-width: 900px) {
      .site-header {
        position: static;
        padding: 16px;
      }

      .header-content {
        grid-template-columns: 1fr;
        gap: 15px;
        align-items: stretch;
      }

      .header-links {
        flex-wrap: wrap;
      }

      .header-links a {
        flex: 1;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-content">
      <div class="brand">
        <h1>Geoapify OpenAPI Explorer</h1>
        <p>OpenAPI 3.1 specifications for Geoapify APIs and MCP tools</p>
      </div>

      <div class="spec-picker">
        <label for="spec-select">Specification</label>
        <select id="spec-select" disabled>
          <option>Loading specifications…</option>
        </select>
      </div>

      <nav class="header-links" aria-label="Documentation links">
        <a href="../api-specs/index.json">JSON catalog</a>
        <a href="https://apidocs.geoapify.com/docs/">API guides</a>
      </nav>
    </div>
  </header>

  <div id="status" class="status" role="status" aria-live="polite" hidden></div>
  <main id="swagger-ui" aria-label="OpenAPI documentation"></main>

  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.32.14/swagger-ui-bundle.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.32.14/swagger-ui-standalone-preset.js"></script>
  <script>
    const CATALOG_PATH = "../api-specs/index.json";
    const DEFAULT_SPEC_ID = "geocoding/forward-geocoding";
    const GROUP_ORDER = [
      "Geocoding",
      "Routing",
      "Places",
      "Location data",
      "Maps",
      "Geometry",
      "Batch",
      "MCP",
      "Other"
    ];

    const select = document.getElementById("spec-select");
    const status = document.getElementById("status");

    function groupFor(specification) {
      const id = specification.id;

      if (id.startsWith("geocoding/")) return "Geocoding";
      if (/^(routing\/|route-matrix\/|route-planner\/|map-matching\/|isolines\/)/.test(id)) return "Routing";
      if (/^(places\/|place-details\/|place-info\/)/.test(id)) return "Places";
      if (/^(boundaries\/|elevation\/|ip-geolocation\/|postcode\/)/.test(id)) return "Location data";
      if (/^(maps\/|icon\/)/.test(id)) return "Maps";
      if (/^geometry/.test(id)) return "Geometry";
      if (id.startsWith("batch/")) return "Batch";
      if (id.startsWith("mcp/")) return "MCP";
      return "Other";
    }

    function shortTitle(title) {
      return title
        .replace(/^Geoapify MCP Tool:\s*/, "")
        .replace(/^Geoapify\s+/, "");
    }

    function showStatus(message, type = "warning") {
      status.textContent = message;
      status.className = type === "error" ? "status error" : "status";
      status.hidden = false;
    }

    function populateSelector(specifications, selectedId) {
      select.textContent = "";
      const grouped = specifications.reduce((groups, specification) => {
        const groupName = groupFor(specification);
        if (!groups.has(groupName)) groups.set(groupName, []);
        groups.get(groupName).push(specification);
        return groups;
      }, new Map());

      GROUP_ORDER.forEach(groupName => {
        const entries = grouped.get(groupName);
        if (!entries) return;

        const group = document.createElement("optgroup");
        group.label = groupName;

        entries
          .sort((left, right) => left.title.localeCompare(right.title))
          .forEach(specification => {
            const option = document.createElement("option");
            option.value = specification.id;
            option.textContent = shortTitle(specification.title);
            option.selected = specification.id === selectedId;
            group.appendChild(option);
          });

        select.appendChild(group);
      });

      select.disabled = false;
    }

    function openSpecification(specification, catalogUrl) {
      const specificationUrl = new URL(specification.openApiSpec, catalogUrl).toString();

      SwaggerUIBundle({
        url: specificationUrl,
        dom_id: "#swagger-ui",
        deepLinking: true,
        displayRequestDuration: true,
        filter: false,
        persistAuthorization: false,
        requestSnippetsEnabled: true,
        validatorUrl: null,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        layout: "BaseLayout"
      });
    }

    async function initialize() {
      try {
        const catalogUrl = new URL(CATALOG_PATH, window.location.href);
        const response = await fetch(catalogUrl);
        if (!response.ok) {
          throw new Error(`Catalog request returned HTTP ${response.status}`);
        }

        const catalog = await response.json();
        if (!Array.isArray(catalog.apis) || catalog.apis.length === 0) {
          throw new Error("The catalog does not contain any specifications");
        }

        const requestedId = new URLSearchParams(window.location.search).get("spec");
        const defaultSpecification = catalog.apis.find(item => item.id === DEFAULT_SPEC_ID) || catalog.apis[0];
        const selectedSpecification = catalog.apis.find(item => item.id === requestedId) || defaultSpecification;

        if (requestedId && requestedId !== selectedSpecification.id) {
          showStatus(`Unknown specification “${requestedId}”. Showing ${selectedSpecification.title}.`);
        }

        populateSelector(catalog.apis, selectedSpecification.id);
        select.addEventListener("change", event => {
          const nextUrl = new URL(window.location.href);
          nextUrl.searchParams.set("spec", event.target.value);
          window.location.assign(nextUrl);
        });

        openSpecification(selectedSpecification, catalogUrl);
      } catch (error) {
        select.textContent = "";
        const option = document.createElement("option");
        option.textContent = "Specifications unavailable";
        select.appendChild(option);
        showStatus(`Unable to load the OpenAPI catalog. ${error.message}`, "error");
      }
    }

    initialize();
  </script>
</body>
</html>
