name: Deploy OpenAPI Explorer to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate OpenAPI specifications
        run: npm run lint

      - name: Build Pages artifact
        run: |
          mkdir -p deploy
          cp docs/index.html deploy/index.html
          cp -R api-specs deploy/api-specs
          sed -i 's#../api-specs/#./api-specs/#g' deploy/index.html
          touch deploy/.nojekyll
          test -f deploy/api-specs/index.json
          ! grep -q '../api-specs/' deploy/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
