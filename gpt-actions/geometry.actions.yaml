openapi: 3.0.3
info:
  title: Geoapify Geometry Operations
  description: Perform spatial operations on GeoJSON geometries including boolean operations, measurements, transformations, and clustering.
  version: 1.0.0
  contact:
    name: Geoapify
    url: https://geoapify.com
    email: info@geoapify.com
servers:
  - url: https://api.geoapify.com/v1

tags:
  - name: Geometry
    description: Spatial geometry operations

paths:
  /geometry/operation:
    post:
      tags: [Geometry]
      operationId: geometryOperation
      summary: Perform geometry operations on GeoJSON data
      description: >
        Execute spatial operations on GeoJSON geometries.
        
        Polygon Operations (union, intersection, difference) - combine or subtract polygons.
        Measurements (distance, area, pointToLineDistance, pointToPolygonDistance) - calculate distances and areas.
        Predicates (contains, crosses, disjoint, intersects, within, valid) - test spatial relationships.
        Transformations (buffer, simplify, transformRotate, transformScale, transformTranslate) - modify geometries.
        Centers (center, centerMean, centerMedian, centerOfMass) - find center points.
        Clustering (clustersDbscan, clustersKmeans, voronoi, concave, convex, tin) - group points.
        Line Operations (pointOnLine, nearestPointOnLine, lineIntersect, along) - work with lines.
        Bounding (bbox, envelope) - get bounding boxes.
        Generators (grid, randomPoint, randomLineString, randomPolygon) - create geometries.
        Advanced (pointsWithinPolygon, greatCircle, tesselate) - specialized operations.
      security:
        - GeoapifyApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - operation
              properties:
                operation:
                  type: string
                  description: The geometry operation to perform
                  enum:
                    - intersection
                    - difference
                    - union
                    - voronoi
                    - contains
                    - crosses
                    - disjoint
                    - intersects
                    - pointOnLine
                    - valid
                    - within
                    - along
                    - area
                    - bbox
                    - buffer
                    - center
                    - centerMean
                    - centerMedian
                    - centerOfMass
                    - clustersDbscan
                    - clustersKmeans
                    - concave
                    - convex
                    - distance
                    - envelope
                    - greatCircle
                    - grid
                    - randomPoint
                    - randomLineString
                    - randomPolygon
                    - lineIntersect
                    - nearestPointOnLine
                    - pointsWithinPolygon
                    - pointToLineDistance
                    - pointToPolygonDistance
                    - tin
                    - tesselate
                    - simplify
                    - transformRotate
                    - transformScale
                    - transformTranslate
                polygons:
                  type: array
                  description: Array of polygons for union/intersection/difference (min 2)
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        enum: [Polygon, MultiPolygon]
                      coordinates:
                        type: array
                        items: {}
                points:
                  type: array
                  description: Array of points for clustering/voronoi/convex/concave/tin/pointsWithinPolygon
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        enum: [Point]
                      coordinates:
                        type: array
                        items:
                          type: number
                geometry:
                  type: object
                  description: Single geometry for buffer/simplify/center/bbox/valid/transform operations
                  properties:
                    type:
                      type: string
                      enum: [Point, LineString, Polygon, MultiPoint, MultiLineString, MultiPolygon]
                    coordinates:
                      type: array
                      items: {}
                geometry1:
                  type: object
                  description: First geometry for predicates (contains/crosses/disjoint/intersects/within)
                  properties:
                    type:
                      type: string
                    coordinates:
                      type: array
                      items: {}
                geometry2:
                  type: object
                  description: Second geometry for predicates
                  properties:
                    type:
                      type: string
                    coordinates:
                      type: array
                      items: {}
                geometries:
                  type: array
                  description: Array of geometries for envelope operation
                  items:
                    type: object
                point:
                  type: object
                  description: Point for pointOnLine/nearestPointOnLine/pointToLineDistance/pointToPolygonDistance
                  properties:
                    type:
                      type: string
                      enum: [Point]
                    coordinates:
                      type: array
                      items:
                        type: number
                point1:
                  type: object
                  description: First point for distance/greatCircle
                  properties:
                    type:
                      type: string
                      enum: [Point]
                    coordinates:
                      type: array
                      items:
                        type: number
                point2:
                  type: object
                  description: Second point for distance/greatCircle
                  properties:
                    type:
                      type: string
                      enum: [Point]
                    coordinates:
                      type: array
                      items:
                        type: number
                line:
                  type: object
                  description: Line for pointOnLine/along/nearestPointOnLine/pointToLineDistance
                  properties:
                    type:
                      type: string
                      enum: [LineString, MultiLineString]
                    coordinates:
                      type: array
                      items: {}
                line1:
                  type: object
                  description: First line for lineIntersect
                  properties:
                    type:
                      type: string
                    coordinates:
                      type: array
                      items: {}
                line2:
                  type: object
                  description: Second line for lineIntersect
                  properties:
                    type:
                      type: string
                    coordinates:
                      type: array
                      items: {}
                polygon:
                  type: object
                  description: Polygon for area/pointsWithinPolygon/pointToPolygonDistance/tesselate
                  properties:
                    type:
                      type: string
                      enum: [Polygon, MultiPolygon]
                    coordinates:
                      type: array
                      items: {}
                bbox:
                  description: Bounding box for grid/randomPoint/randomLineString/randomPolygon/voronoi
                  oneOf:
                    - type: array
                      items:
                        type: number
                      minItems: 4
                      maxItems: 4
                    - type: object
                      properties:
                        lon1:
                          type: number
                        lat1:
                          type: number
                        lon2:
                          type: number
                        lat2:
                          type: number
                distance:
                  type: number
                  description: Distance for along/buffer/transformTranslate
                maxDistance:
                  type: number
                  description: Max distance for clustersDbscan
                angle:
                  type: number
                  description: Rotation angle in degrees for transformRotate
                factor:
                  type: number
                  description: Scale factor for transformScale
                direction:
                  type: number
                  description: Direction in degrees for transformTranslate
                type:
                  type: string
                  description: Grid type for grid operation
                  enum: [hex, point, square, triangle]
                cellSide:
                  type: number
                  description: Cell side for grid operation
                count:
                  type: integer
                  description: Count for randomPoint/randomLineString/randomPolygon
                params:
                  type: object
                  description: Optional parameters varying by operation
                  properties:
                    units:
                      type: string
                      description: Unit of measurement
                      enum: [meters, metres, millimeters, millimetres, centimeters, centimetres, kilometers, kilometres, miles, nauticalmiles, inches, yards, feet, radians, degrees]
                    steps:
                      type: integer
                      description: Number of steps for buffer
                    tolerance:
                      type: number
                      description: Tolerance for simplify
                    highQuality:
                      type: boolean
                      description: High quality simplification
                    mutate:
                      type: boolean
                      description: Mutate input geometry
                    numberOfClusters:
                      type: integer
                      description: Number of clusters for clustersKmeans
                    minPoints:
                      type: integer
                      description: Minimum points for clustersDbscan
                    maxEdge:
                      type: number
                      description: Max edge length for concave hull
                    concavity:
                      type: number
                      description: Concavity for convex hull
                    npoints:
                      type: integer
                      description: Number of points for greatCircle
                    offset:
                      type: number
                      description: Offset for greatCircle
                    pivot:
                      type: array
                      description: Pivot point [lon, lat] for transformRotate
                      items:
                        type: number
                    origin:
                      description: Origin for transformScale (center/centroid/sw/se/nw/ne or [lon,lat])
                    zTranslation:
                      type: number
                      description: Z-axis translation for transformTranslate
                    numVertices:
                      type: integer
                      description: Number of vertices for random geometries
                    maxLength:
                      type: number
                      description: Max length for randomLineString
                    maxRotation:
                      type: number
                      description: Max rotation for randomLineString
                    maxRadialLength:
                      type: number
                      description: Max radial length for randomPolygon
                    recompute:
                      type: boolean
                      description: Recompute bbox
      responses:
        "200":
          description: Operation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    description: Result type
                    enum: [geojson, number, boolean, empty]
                  data:
                    description: Result data (geometry, number, boolean, or null)
              examples:
                geojson:
                  value:
                    type: geojson
                    data:
                      type: Polygon
                      coordinates: [[[0, 0], [10, 0], [10, 10], [0, 10], [0, 0]]]
                number:
                  value:
                    type: number
                    data: 1234.56
                boolean:
                  value:
                    type: boolean
                    data: true
        "400":
          description: Bad request
        "401":
          description: Unauthorized
        "429":
          description: Too many requests
        "500":
          description: Internal server error

components:
  securitySchemes:
    GeoapifyApiKey:
      type: apiKey
      in: query
      name: apiKey
      description: API key for Geoapify services

