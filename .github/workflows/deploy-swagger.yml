name: Deploy OpenAPI Explorer to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate OpenAPI specifications
        run: npm run lint

      - name: Build Pages artifact
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const outputDirectory = 'deploy';
          fs.mkdirSync(outputDirectory, { recursive: true });
          fs.cpSync('api-specs', path.join(outputDirectory, 'api-specs'), { recursive: true });

          const sourceHtml = fs.readFileSync('docs/index.html', 'utf8');
          const deployedHtml = sourceHtml.replaceAll('../api-specs/', './api-specs/');
          if (deployedHtml.includes('../api-specs/')) {
            throw new Error('The deployed explorer contains unresolved local catalog paths');
          }

          fs.writeFileSync(path.join(outputDirectory, 'index.html'), deployedHtml);
          fs.writeFileSync(path.join(outputDirectory, '.nojekyll'), '');

          const catalogPath = path.join(outputDirectory, 'api-specs', 'index.json');
          const catalog = JSON.parse(fs.readFileSync(catalogPath, 'utf8'));
          for (const specification of catalog.apis) {
            const specificationPath = path.resolve(
              outputDirectory,
              'api-specs',
              specification.openApiSpec
            );
            if (!fs.existsSync(specificationPath)) {
              throw new Error(`Catalog references a missing file: ${specification.openApiSpec}`);
            }
          }

          console.log(`Built Pages artifact with ${catalog.apis.length} specifications`);
          NODE

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
